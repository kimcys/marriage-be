x-ocr-common-env: &ocr-common-env
  APP_NAME: ${APP_NAME:-Marriage OCR API}
  APP_ENV: ${APP_ENV:-development}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marriage_ocr}:${POSTGRES_PASSWORD:-marriage_ocr}@postgres:5432/${POSTGRES_DB:-marriage_ocr}
  STORAGE_ROOT: /app/storage
  OCR_PYTHON_EXECUTABLE: /opt/venv/bin/python
  OCR_MODULE: ${OCR_MODULE:-marriage_ocr.cli}
  OCR_CONFIG_PATH_HANDWRITTEN: /opt/marriage-ocr/config/production.yaml
  OCR_CONFIG_PATH_TYPED: /opt/marriage-ocr/config/typed_borang4b.yaml
  OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-3600}
  OCR_STDERR_API_LIMIT: ${OCR_STDERR_API_LIMIT:-1000}
  MARRIAGE_OCR_GIT_URL: ${MARRIAGE_OCR_GIT_URL:-https://github.com/kimcys/marriage-ocr.git}
  MARRIAGE_OCR_GIT_REF: ${MARRIAGE_OCR_GIT_REF:-ad8235c5186c100dea723f7d6a011150dfd18dad}
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vision.json
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-exports}
  MINIO_REGION_NAME: ${MINIO_REGION_NAME:-us-east-1}
  MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minio}
  MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minio123}
  VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
  JOB_EXECUTOR_BACKEND: ${JOB_EXECUTOR_BACKEND:-celery}
  OCR_MAX_CONCURRENT_JOBS: ${OCR_MAX_CONCURRENT_JOBS:-4}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marriage_ocr}
      POSTGRES_USER: ${POSTGRES_USER:-marriage_ocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marriage_ocr}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marriage_ocr} -d ${POSTGRES_DB:-marriage_ocr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - valkey_data:/data

  minio:
    profiles: ["s3"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      args:
        MARRIAGE_OCR_GIT_URL: ${MARRIAGE_OCR_GIT_URL:-https://github.com/kimcys/marriage-ocr.git}
        MARRIAGE_OCR_GIT_REF: ${MARRIAGE_OCR_GIT_REF:-ad8235c5186c100dea723f7d6a011150dfd18dad}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      <<: *ocr-common-env
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-1048576}
    volumes:
      - ./storage:/app/storage
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./secrets/google-vision.json}:/run/secrets/google-vision.json:ro
    ports:
      - "8000:8000"
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn marriage_ocr_api.main:app --host 0.0.0.0 --port 8000 --workers 1

  worker:
    build:
      context: .
      args:
        MARRIAGE_OCR_GIT_URL: ${MARRIAGE_OCR_GIT_URL:-https://github.com/kimcys/marriage-ocr.git}
        MARRIAGE_OCR_GIT_REF: ${MARRIAGE_OCR_GIT_REF:-ad8235c5186c100dea723f7d6a011150dfd18dad}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      <<: *ocr-common-env
    volumes:
      - ./storage:/app/storage
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./secrets/google-vision.json}:/run/secrets/google-vision.json:ro
    command:
      - /bin/sh
      - -c
      - "exec celery -A marriage_ocr_api.jobs.celery_app worker --loglevel=info --concurrency=${OCR_MAX_CONCURRENT_JOBS:-4}"

volumes:
  postgres_data:
  valkey_data:
  minio_data:
