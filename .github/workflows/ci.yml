name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marriage_ocr
          POSTGRES_USER: marriage_ocr
          POSTGRES_PASSWORD: marriage_ocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marriage_ocr -d marriage_ocr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://marriage_ocr:marriage_ocr@localhost:5432/marriage_ocr
      STORAGE_ROOT: /tmp/marriage-ocr-storage
      OCR_CONFIG_PATH_HANDWRITTEN: /tmp/marriage-ocr-config/production.yaml
      OCR_CONFIG_PATH_TYPED: /tmp/marriage-ocr-config/typed_borang4b.yaml
      OCR_PYTHON_EXECUTABLE: /usr/bin/python3
      OCR_MODULE: tests.fixtures.fake_ocr_cli
      OCR_MAX_CONCURRENT_JOBS: 1
      MARRIAGE_OCR_GIT_URL: https://github.com/kimcys/marriage-ocr.git
      MARRIAGE_OCR_GIT_REF: 6faae7e755ac30733bbf81709965604d69725444
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-google.json
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Prepare readiness files
        run: |
          mkdir -p /tmp/marriage-ocr-config
          printf 'ok: true\n' > /tmp/marriage-ocr-config/production.yaml
          printf 'ok: true\n' > /tmp/marriage-ocr-config/typed_borang4b.yaml
          printf '{}' > /tmp/fake-google.json
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: OpenAPI export
        run: python scripts/export_openapi.py
      - name: Pytest
        run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marriage_ocr
          POSTGRES_USER: marriage_ocr
          POSTGRES_PASSWORD: marriage_ocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marriage_ocr -d marriage_ocr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://marriage_ocr:marriage_ocr@localhost:5432/marriage_ocr
      STORAGE_ROOT: /tmp/marriage-ocr-storage
      OCR_CONFIG_PATH_HANDWRITTEN: /tmp/marriage-ocr-config/production.yaml
      OCR_CONFIG_PATH_TYPED: /tmp/marriage-ocr-config/typed_borang4b.yaml
      OCR_PYTHON_EXECUTABLE: /usr/bin/python3
      OCR_MODULE: tests.fixtures.fake_ocr_cli
      OCR_MAX_CONCURRENT_JOBS: 1
      MARRIAGE_OCR_GIT_URL: https://github.com/kimcys/marriage-ocr.git
      MARRIAGE_OCR_GIT_REF: 6faae7e755ac30733bbf81709965604d69725444
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-google.json
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Prepare readiness files
        run: |
          mkdir -p /tmp/marriage-ocr-config
          printf 'ok: true\n' > /tmp/marriage-ocr-config/production.yaml
          printf 'ok: true\n' > /tmp/marriage-ocr-config/typed_borang4b.yaml
          printf '{}' > /tmp/fake-google.json
      - name: Integration pytest
        run: pytest -q -m integration -k 'not docker_only_end_to_end_smoke'

  docker-e2e:
    runs-on: ubuntu-latest
    # Allowed to fail for now -- this smoke test still assumes a direct
    # document-upload endpoint that no longer exists (real ingestion is
    # OneDrive-link-only, which needs real network access CI doesn't have).
    # Doesn't block `deploy` (see its `needs:` below) until the test itself
    # is redesigned around the OneDrive-only ingestion flow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Docker compose config
        run: docker compose config
      - name: Docker smoke test
        run: pytest -q -m integration tests/integration/test_docker_e2e.py

  # Builds the production image and rolls it out to every DigitalOcean
  # Droplet tagged marriage-be-api / marriage-be-worker -- only after all
  # three test jobs above pass, and only for a real push to main (never a
  # pull request, and never a fork, since only main's own push event has
  # access to the secrets below). Requires (all one-time setup, done
  # outside this repo): a DigitalOcean Container Registry and Droplets
  # tagged marriage-be-api/marriage-be-worker, an SSH key pair whose
  # public half is on every Droplet and whose private half is the
  # DEPLOY_SSH_KEY secret below, and the three repo secrets this job
  # reads (DIGITALOCEAN_ACCESS_TOKEN, DIGITALOCEAN_REGISTRY_NAME,
  # DEPLOY_SSH_KEY) plus a "production" environment (Settings ->
  # Environments) to hold them.
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: [unit, integration, docker-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    env:
      REGISTRY_IMAGE: registry.digitalocean.com/${{ secrets.DIGITALOCEAN_REGISTRY_NAME }}/marriage-be
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build image
        run: |
          docker build \
            -t "${REGISTRY_IMAGE}:${{ github.sha }}" \
            -t "${REGISTRY_IMAGE}:latest" \
            .

      - name: Push image
        run: |
          docker push "${REGISTRY_IMAGE}:${{ github.sha }}"
          docker push "${REGISTRY_IMAGE}:latest"

      # Droplets are discovered by tag, not hardcoded IPs -- add/remove a
      # worker Droplet (see the guide's scaling section) and the very next
      # deploy picks it up automatically, no workflow edit required.
      - name: Look up API Droplet(s)
        id: api
        run: |
          ips=$(doctl compute droplet list --tag-name marriage-be-api --format PublicIPv4 --no-header | paste -sd, -)
          echo "ips=$ips" >> "$GITHUB_OUTPUT"

      - name: Look up worker Droplet(s)
        id: worker
        run: |
          ips=$(doctl compute droplet list --tag-name marriage-be-worker --format PublicIPv4 --no-header | paste -sd, -)
          echo "ips=$ips" >> "$GITHUB_OUTPUT"

      # `git pull` keeps each Droplet's docker-compose.production.yml in
      # sync with this repo automatically -- .env.production lives in the
      # same directory but is gitignored (never tracked, so `git pull`
      # never touches it) and was put there once during that Droplet's
      # initial setup.
      - name: Deploy api + beat
        if: steps.api.outputs.ips != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.api.outputs.ips }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/marriage-be
            git pull --ff-only origin main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.production.yml --env-file .env.production pull api beat
            docker compose -f docker-compose.production.yml --env-file .env.production up -d api beat
            docker image prune -f

      - name: Deploy worker(s)
        if: steps.worker.outputs.ips != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.worker.outputs.ips }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/marriage-be
            git pull --ff-only origin main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.production.yml --env-file .env.production pull worker
            docker compose -f docker-compose.production.yml --env-file .env.production up -d worker
            docker image prune -f

      - name: Confirm the API is actually up
        if: steps.api.outputs.ips != ''
        run: |
          ip=$(echo "${{ steps.api.outputs.ips }}" | cut -d, -f1)
          for i in $(seq 1 10); do
            if curl -fsS "http://${ip}:8000/health"; then exit 0; fi
            sleep 3
          done
          echo "API did not report healthy after deploy" >&2
          exit 1
